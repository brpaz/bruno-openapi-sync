name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  publish:
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Release Drafter names the GitHub Release "v1.2.3" without bumping package.json,
      # so the tag (not the committed version) is the source of truth for what gets published.
      # This has to happen before `pnpm build`, not after: the CLI's `--version` is a native
      # JSON import (`import packageJson from "../package.json" with { type: "json" }`),
      # which rolldown inlines into dist/cli.mjs at build time — a build reusing the generic
      # `build` job's artifact would ship whatever version was committed, not the release tag.
      - name: Set package version from release tag
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: pnpm build

      - run: pnpm publish --no-git-checks --access public --provenance

      - name: Update Changelog
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ github.event.release.tag_name }}
          release-notes: ${{ github.event.release.body }}

      # Commit the changelog entry and the version bump only after a successful publish —
      # if `pnpm publish` above failed, we don't want git advanced for a release that
      # never actually shipped.
      - name: Commit CHANGELOG.md and package.json
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: ${{ github.event.release.target_commitish }}
          commit_message: "chore(release): bump version to ${{ github.event.release.tag_name }}"
          file_pattern: "CHANGELOG.md package.json"
