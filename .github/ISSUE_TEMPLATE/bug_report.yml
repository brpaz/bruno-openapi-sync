name: Bug report
description: Report something that isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command(s) run, spec used (attach or link if possible), and collection state.
      placeholder: |
        1. bruno-openapi-sync sync --spec ./openapi.yaml --output ./my-collection
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: bruno-openapi-sync version / commit
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
