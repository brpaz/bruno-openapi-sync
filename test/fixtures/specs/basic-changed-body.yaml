openapi: 3.0.3
info:
  title: Basic Test API
  version: "1.0.0"
servers:
  - url: https://api.example.com/v1
    description: Production
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
security:
  - ApiKeyAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          required: false
          description: Max number of results
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      operationId: createPet
      summary: Create a pet
      tags:
        - pets
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                tag:
                  type: string
                age:
                  type: integer
      responses:
        "201":
          description: Created
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Find pet by ID
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of pet to return
          schema:
            type: string
      responses:
        "200":
          description: OK
  /health:
    get:
      operationId: getHealth
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
