openapi: 3.0.3
info:
  title: Basic Test API
  version: "1.0.0"
servers:
  - url: https://api.example.com/v1
    description: Production
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
security:
  - ApiKeyAuth: []
paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          required: false
          description: Max number of results
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Find pet by ID
      tags:
        - animals
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of pet to return
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: ID of pet to delete
          schema:
            type: string
      responses:
        "204":
          description: Deleted
